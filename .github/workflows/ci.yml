name: ci

# A pull request is checked only once it has the run-ci label (adding the
# label starts a run; each push after it runs again); a release's pull
# request is no different, since its tag runs everything anyway. A push to
# main is not checked (it was, as its pull request, if anyone asked). Run it
# by hand from the Actions tab if needed. A release always runs all of it:
# release.yml calls it on the tag.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  # release.yml runs all of this on the tag first, and fails the release on
  # any failure.
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request cancels the run still going for the older one.
# A release's checks (workflow_call) run under the tag's ref, so they are
# never cancelled by a push to main. Adding some other label runs nothing,
# in a group of its own, so it cancels nothing either.
concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'run-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

# Jobs run on omarchy, the owner's self-hosted runner (ci/runner/), when the
# repository variable SELF_HOSTED is true and the event is the owner's push;
# everything else, pull requests included, runs on ubuntu-latest.
jobs:
  go:
    # Only what was asked for: see "on" above.
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' || github.event.label.name == 'run-ci') && contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ${{ (vars.SELF_HOSTED == 'true' && github.event_name == 'push' && github.actor == github.repository_owner) && fromJSON('["self-hosted","omarchy"]') || 'ubuntu-latest' }}
    steps:
      # omarchy runs only the owner's pushes; its job-started hook
      # (ci/runner/job-started.sh) refuses anything else too.
      - name: Only the owner's pushes run on a self-hosted runner
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ] || [ "$EVENT" != push ]; then
            echo "::error::$EVENT by $ACTOR may not run on a self-hosted runner"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches between jobs.
          cache: ${{ runner.environment == 'github-hosted' }}
      # Sessions are tmux sessions, so their tests need it.
      # omarchy's image has it; apt's mirrors are slow from there.
      - run: command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
      - run: go vet ./...
      - run: go test -race ./...
        # GitHub's Ubuntu runners stop Chromium's sandbox (user namespaces),
        # which changes what the agent browser's status says.
        env:
          BERTH_BROWSER_NO_SANDBOX: "1"
      # A real Chromium alone, without the race detector or every other
      # package's tests starving it: it times out starting otherwise.
      - run: go test ./internal/box/ -run 'TestAgentBrowserDrivesARealChromium|TestTheBrowserSizeReachesARealChromium' -count=1 -v
        # GitHub's Ubuntu runners stop Chromium's sandbox (user namespaces).
        env:
          BERTH_BROWSER_NO_SANDBOX: "1"
          BERTH_TEST_CHROMIUM: "1"
          # The runner's Chromium is a snap, slow to start the first time.
          BERTH_BROWSER_START_TIMEOUT: "90s"

  shell:
    # Only what was asked for: see "on" above.
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' || github.event.label.name == 'run-ci') && contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ${{ (vars.SELF_HOSTED == 'true' && github.event_name == 'push' && github.actor == github.repository_owner) && fromJSON('["self-hosted","omarchy"]') || 'ubuntu-latest' }}
    steps:
      # omarchy runs only the owner's pushes; its job-started hook
      # (ci/runner/job-started.sh) refuses anything else too.
      - name: Only the owner's pushes run on a self-hosted runner
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ] || [ "$EVENT" != push ]; then
            echo "::error::$EVENT by $ACTOR may not run on a self-hosted runner"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # ubuntu-latest ships shellcheck. install.sh is served at berthd.app/install.
      - run: shellcheck site/install.sh scripts/build-release.sh scripts/build-tmux.sh scripts/publish.sh scripts/mac-release.sh scripts/linux-release.sh scripts/release-helper.sh scripts/release-leadline-helper.sh
      # The release tests (warnings and errors; their style is their own).
      - run: shellcheck -x -S warning scripts/release-check.sh scripts/fresh-user-test.sh scripts/linux-box-test.sh scripts/upgrade-test.sh scripts/release-test/common.sh scripts/release-test/macos/lib.sh scripts/release-test/macos/launchctl scripts/release-test/linux/lib.sh scripts/release-test/linux/fake-chromium
      - run: sh -n site/install.sh && dash -n site/install.sh
      # The release's feed job merges the Linux app into latest.json with it.
      - run: shellcheck -x -S warning scripts/release-test/feed-merge-test.sh && scripts/release-test/feed-merge-test.sh

  app:
    # Only what was asked for: see "on" above.
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' || github.event.label.name == 'run-ci') && contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ${{ (vars.SELF_HOSTED == 'true' && github.event_name == 'push' && github.actor == github.repository_owner) && fromJSON('["self-hosted","omarchy"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: app
    steps:
      # omarchy runs only the owner's pushes; its job-started hook
      # (ci/runner/job-started.sh) refuses anything else too.
      - name: Only the owner's pushes run on a self-hosted runner
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ] || [ "$EVENT" != push ]; then
            echo "::error::$EVENT by $ACTOR may not run on a self-hosted runner"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # A self-hosted runner keeps its pnpm store between jobs.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:plugins
      # Tooltips are the app's own, never the HTML title attribute.
      - run: pnpm check:titles
      # Text is sized by the type scale in index.css (scripts/check-type.mjs).
      - run: pnpm check:type
      # Bars and gutters come from the layout grid in index.css (scripts/check-grid.mjs).
      - run: pnpm check:grid
      # The release CSP must let the app load its own built-in plugins.
      - run: pnpm check:csp
      # Every built-in theme's text, states and terminal meet their contrast
      # (src/themes/contrast.ts).
      - run: pnpm check:themes
      # packages/core, shared with the phone app, imports only itself and
      # has no DOM (scripts/check-core.mjs).
      - run: pnpm check:core
      # The split tree's moves (lib/layout.test.ts), and packages/core's tests.
      - run: pnpm test
      - run: pnpm build
      # The smoke suite (e2e/): the production build in Playwright's Chromium,
      # on the mock fixtures, with no page error allowed. The browser is
      # cached by Playwright's version; --with-deps adds the system libraries.
      - id: playwright
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: runner.environment == 'github-hosted' && !startsWith(github.ref, 'refs/tags/') # a self-hosted runner keeps it
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - run: pnpm exec playwright install --with-deps --only-shell chromium
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # omarchy's runners share one network, so two runs at once would both
      # take Playwright's default port: each takes a free one of its own.
      - name: Pick a free port for the e2e server
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "E2E_PORT=$(python3 -c '
          import random, socket
          ports = list(range(1421, 1440)); random.shuffle(ports)
          for p in ports:
              s = socket.socket()
              try:
                  s.bind(("127.0.0.1", p)); print(p); break
              except OSError:
                  pass
              finally:
                  s.close()
          ')" >> "$GITHUB_ENV"
      # A release (a tag) skips the e2e suite for now. On pull requests it
      # runs and reports but doesn't block, until its flakes on GitHub's
      # hosted runners are fixed.
      - run: pnpm test:e2e
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        env:
          # omarchy has 16 cores; a hosted runner has 4.
          E2E_WORKERS: ${{ runner.environment == 'self-hosted' && '6' || '2' }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: app/node_modules/.e2e-results
          include-hidden-files: true
          retention-days: 7

  # The Linux desktop app (an alpha) builds, bundles and passes its Rust
  # tests, so a change that breaks it shows here rather than at a release.
  # A debug build with no updater signature: the release's linux job
  # (scripts/linux-release.sh) does the rest. Cached, it takes a few minutes,
  # beside the app job's longer e2e suite.
  linux-app:
    # Only what was asked for: see "on" above.
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' || github.event.label.name == 'run-ci') && contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test --locked
      # The release build's own code (cfg(not(debug_assertions))) compiles.
      - name: Check the release configuration
        working-directory: app/src-tauri
        run: cargo check --locked --release
      - name: Build the AppImage and the .deb
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --debug --bundles deb,appimage
      - name: Check the bundles
        run: |
          set -euo pipefail
          deb="$(ls app/src-tauri/target/debug/bundle/deb/*.deb)"
          appimage="$(ls app/src-tauri/target/debug/bundle/appimage/*.AppImage)"
          # Extracted first: grep -q on a pipe would cut dpkg-deb off (pipefail).
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          test -x "$RUNNER_TEMP/deb/usr/bin/berth-app"
          grep -q '^MimeType=.*x-scheme-handler/berth' "$RUNNER_TEMP"/deb/usr/share/applications/*.desktop
          grep -q '^Exec=berth-app %u$' "$RUNNER_TEMP"/deb/usr/share/applications/*.desktop
          file "$appimage" | grep -q 'ELF 64-bit'
          ls -la "$deb" "$appimage"

  docs-site:
    # Only what was asked for: see "on" above.
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' || github.event.label.name == 'run-ci') && contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ${{ (vars.SELF_HOSTED == 'true' && github.event_name == 'push' && github.actor == github.repository_owner) && fromJSON('["self-hosted","omarchy"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: docs-site
    steps:
      # omarchy runs only the owner's pushes; its job-started hook
      # (ci/runner/job-started.sh) refuses anything else too.
      - name: Only the owner's pushes run on a self-hosted runner
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ] || [ "$EVENT" != push ]; then
            echo "::error::$EVENT by $ACTOR may not run on a self-hosted runner"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # A self-hosted runner keeps its pnpm store between jobs.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The pages are the repository's docs/ folder; a broken page fails here.
      - run: pnpm build

  mobile:
    # Only what was asked for: see "on" above.
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' || github.event.label.name == 'run-ci') && contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ${{ (vars.SELF_HOSTED == 'true' && github.event_name == 'push' && github.actor == github.repository_owner) && fromJSON('["self-hosted","omarchy"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      # omarchy runs only the owner's pushes; its job-started hook
      # (ci/runner/job-started.sh) refuses anything else too.
      - name: Only the owner's pushes run on a self-hosted runner
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ] || [ "$EVENT" != push ]; then
            echo "::error::$EVENT by $ACTOR may not run on a self-hosted runner"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # A self-hosted runner keeps its pnpm store between jobs.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The phone app (mobile/AGENTS.md). No iOS build here: EAS builds
      # it. Metro's bundle checks that packages/core resolves.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm export

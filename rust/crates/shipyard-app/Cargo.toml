[package]
name = "shipyard-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
shipyard-api = { path = "../shipyard-api" }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
